
<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060E1A">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">

  <title>Payment Successful — Lockin</title>

  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="apple-touch-icon" href="../assets/images/favicon.png">

  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../account/css/account.css">

  <style>
    /* Pulse animation for verify */
    .auth-icon--success {
      background: rgba(16, 185, 129, 0.1);
      color: #10B981;
      margin: 0 auto 1.5rem;
    }
  </style>
</head>
<body>

<!-- ── Navigation ────────────────────────────────────────────────────── -->
<nav class="nav" id="nav" role="navigation" aria-label="Main">
  <div class="container nav__inner">
    <a href="/" class="nav__logo" aria-label="Lockin home">
      <img src="../assets/images/logo-full.png" alt="Lockin">
    </a>
    <ul class="nav__links" role="list">
      <li><a href="/#showcase"  class="nav__link">How it works</a></li>
      <li><a href="/#pricing"   class="nav__link">Pricing</a></li>
      <li><a href="/resources/" class="nav__link">Resources</a></li>
      <li><a href="/support/"   class="nav__link">Support</a></li>
      <li class="nav__auth-item"><a href="/account/login.html" class="nav__link">Log in</a></li>
    </ul>
    <div class="nav__cta">
      <a href="/account/" class="btn btn--outline btn--sm nav__account-btn js-auth-only" style="display: none;">Account</a>
      <button type="button" class="btn btn--primary btn--sm js-launch-app" aria-haspopup="dialog">Launch app →</button>
    </div>
    <button class="nav__burger" id="navBurger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navDrawer">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ── Page ───────────────────────────────────────────────────────────── -->
<div class="auth-wrap">
  <main class="auth-main" style="align-items: flex-start; padding-top: 140px;">
    <div class="auth-bg" aria-hidden="true">
      <div class="auth-bg__blob auth-bg__blob--1"></div>
    </div>

    <!-- UI injected here by script -->
    <div class="auth-card" id="successCard" style="max-width: 600px; margin: 0 auto; text-align: center;">

      <div class="auth-icon auth-icon--loading" id="loadingIcon" style="margin: 0 auto 1.5rem;">
        <svg class="spinner-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      </div>

      <div class="auth-icon auth-icon--success" id="checkIcon" style="display: none;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>

      <h1 class="auth-title" id="pageTitle">Verifying checkout...</h1>
      <p class="auth-subtitle" id="pageSubtitle" style="margin-bottom: 2rem;">Please do not close this tab while we confirm your payment with Stripe.</p>

      <div style="display: flex; gap: var(--sp-4); justify-content: center; display: none;" id="actionButtons">
        <a href="/account/index.html" class="btn btn--primary btn--md">Go to Account</a>
        <button type="button" class="btn btn--outline btn--md js-launch-app" aria-haspopup="dialog">Launch app</button>
      </div>

    </div>

  </main>
</div>

<!-- ── Footer ────────────────────────────────────────────────────────── -->
<footer class="footer">
  <div class="container">
    <div class="footer__bottom">
      <p class="footer__copyright">
        © <span id="footerYear"></span> <strong>Lockin.tech</strong>. All rights reserved.
      </p>
    </div>
  </div>
</footer>

<script type="module" src="../js/nav.js?v=6"></script>
<script src="js/success.js?v=6"></script>
<script>
  import('../js/nav.js?v=6').then(m => m.initNav());
  document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>
</body>
</html>
