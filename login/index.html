<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Random Text</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .random-text {
            font-size: 1.5rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-in;
        }
        
        button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="random-text" id="randomText">Loading random text...</div>
    <button onclick="generateRandomText()">Generate New Text</button>
    
    <script>
        const randomTexts = [
            "The quantum cat observed the universe and found it lacking in sardines.",
            "Digital dreams cascade through silicon valleys of forgotten memories.",
            "Time flows backwards on Tuesdays, but only for left-handed philosophers.",
            "The algorithm whispered secrets to the database at midnight.",
            "Pixels dance in binary ballet across the screen of consciousness.",
            "Coffee fuels the matrix of morning productivity protocols.",
            "Error 404: Meaning not found in this dimension.",
            "The cloud storage holds dreams of electric sheep.",
            "Recursive loops spiral into infinite tea breaks.",
            "Authentication failed: reality.exe has stopped working."
        ];
        
        function generateRandomText() {
            const textElement = document.getElementById('randomText');
            const randomIndex = Math.floor(Math.random() * randomTexts.length);
            
            textElement.style.animation = 'none';
            setTimeout(() => {
                textElement.textContent = randomTexts[randomIndex];
                textElement.style.animation = 'fadeIn 1s ease-in';
            }, 100);
        }
        
        // Generate initial random text when page loads
        document.addEventListener('DOMContentLoaded', generateRandomText);
    </script>
</body>
</html>
