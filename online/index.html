<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockin.tech | Coming Soon</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" type="image/png" sizes="192x192" href="../static/assets/favicon.png">
    <style>
        /* Override or add specific styles for the coming soon page */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .coming-soon-hero {
            text-align: center;
            padding: 4rem 1rem;
        }
        .coming-soon-hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--text-primary, #111); /* Fallback if var not defined */
        }
        .coming-soon-hero p {
            font-size: 1.25rem;
            color: var(--text-secondary, #555);
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .logo-large {
            height: 80px;
            width: auto;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="/" aria-label="Lockin.tech home">
                <img src="../static/assets/lockin_full_transparent.png" alt="Lockin.tech logo" class="brand-logo">
            </a>
            <nav class="nav" aria-label="Primary">
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="coming-soon-hero">
            <div class="container">
                <img src="../static/assets/lockin_full_transparent.png" alt="Lockin Logo" class="logo-large">
                <h1>Web App Coming Soon</h1>
                <p>We're currently building the ultimate web experience for Lockin.tech. Stay tuned for updates!</p>
                <div class="hero-actions" style="justify-content: center;">
                    <a class="btn btn-primary" href="/">Back to Home</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <div>
                <p>© 2025 Lockin.tech. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
